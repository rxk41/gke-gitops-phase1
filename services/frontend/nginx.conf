server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location /api/products { proxy_pass http://product-api:8000/api/products; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /api/orders { proxy_pass http://order-api:8000/api/orders; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /health { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location / { try_files $uri $uri/ /index.html; }
}
