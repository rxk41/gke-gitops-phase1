apiVersion: v1
kind: Service
metadata:
  name: postgresql
  namespace: {{ .Values.namespace }}
spec:
  clusterIP: None
  selector: { app: postgresql }
  ports: [{ name: postgres, port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: {{ .Values.namespace }}
spec:
  serviceName: postgresql
  replicas: 1
  selector: { matchLabels: { app: postgresql } }
  template:
    metadata:
      labels: { app: postgresql }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          ports: [{ containerPort: 5432, name: postgres }]
          env:
            - { name: POSTGRES_DB, value: store }
            - { name: POSTGRES_USER, value: store }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.postgres.existingSecret }}, key: password }
          readinessProbe: { exec: { command: ["sh", "-c", "pg_isready -U store -d store"] }, initialDelaySeconds: 10, periodSeconds: 5 }
          livenessProbe: { exec: { command: ["sh", "-c", "pg_isready -U store -d store"] }, initialDelaySeconds: 30, periodSeconds: 10 }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data, subPath: postgres }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.postgres.storageClassName | quote }}
        resources: { requests: { storage: {{ .Values.postgres.storage | quote }} } }
