name: CI - tests, quality, images
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [product-api, order-api]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12', cache: pip, cache-dependency-path: 'services/${{ matrix.service }}/requirements-dev.txt' }
      - run: pip install -r services/${{ matrix.service }}/requirements-dev.txt
      - run: ruff check .
        working-directory: services/${{ matrix.service }}
      - run: python -m pytest -q tests
        working-directory: services/${{ matrix.service }}
  frontend-quality:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/frontend } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npm run lint
      - run: npm test
      - run: npm run build
  sonar:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-quality]
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Authenticate to Google Cloud using WIF
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_GITHUB_ACTIONS_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
      - name: Read Sonar token from Secret Manager
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        shell: bash
        env: { PROJECT_ID: k8s-learning-510807 }
        run: |
          token="$(gcloud secrets versions access latest --secret=sonar-token --project="$PROJECT_ID")"
          test -n "$token"
          echo "::add-mask::$token"
          echo "SONAR_TOKEN=$token" >> "$GITHUB_ENV"
      - name: SonarQube Cloud scan
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.qualitygate.wait=true
  build-push:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [backend-tests, frontend-quality, sonar]
    runs-on: ubuntu-latest
    env:
      PROJECT_ID: k8s-learning-510807
      REGION: us-central1
      REPOSITORY: microservices
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_GITHUB_ACTIONS_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
      - name: Set image tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="${GITHUB_SHA}"; fi
          echo "IMAGE_TAG=$TAG" >> "$GITHUB_ENV"
      - name: Build and push product API
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/product-api:${IMAGE_TAG}"
          docker build -t "$IMAGE" ./services/product-api
          docker push "$IMAGE"
      - name: Build and push order API
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/order-api:${IMAGE_TAG}"
          docker build -t "$IMAGE" ./services/order-api
          docker push "$IMAGE"
      - name: Build and push frontend
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/product-frontend:${IMAGE_TAG}"
          docker build -t "$IMAGE" ./services/frontend
          docker push "$IMAGE"
